<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d35;--line:#2b3860;--muted:#9aa7c7;--accent:#6ea8fe;--danger:#ff7b8a}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px;display:grid;place-items:center;font:16px Inter,Segoe UI,Arial,sans-serif;color:#eef3ff;background:radial-gradient(circle at 50% -10%,#29477f 0,transparent 45%),var(--bg)}main{width:min(440px,100%)}h1{font-size:32px;margin:18px 0 8px}.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#80b0ff,#5a7de0);font-size:28px}.card{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}p,label{color:var(--muted);line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}button{border:0;border-radius:11px;padding:12px;background:#101a33;color:#dce7ff;font:700 14px Inter,Segoe UI,Arial,sans-serif;cursor:pointer}.active,.primary{background:var(--accent);color:#06122b}input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#0c1327;color:#eef3ff;padding:13px;font:inherit}label{display:block;margin:14px 0 6px;font-size:13px}textarea{min-height:88px}.hidden{display:none}.scanner{overflow:hidden;border-radius:12px;background:#070b14}.scanner video{width:100%;display:block}.error{color:var(--danger)}.hint{font-size:13px}
</style></head><body><main><div class="logo">✓</div><h1>Task Manager</h1><p>Подключение к серверу команды</p><section class="card"><div class="tabs"><button id="qr" class="active">QR-код</button><button id="manual">Ввести вручную</button></div><div id="qr-panel"><div id="camera" class="scanner"></div><p id="camera-status" class="hint">Открываю основную камеру…</p><label>Вставить данные QR-кода</label><textarea id="payload" placeholder='{"server_url":"https://...","pairing_code":"..."}'></textarea><button id="payload-connect" class="primary">Подключиться</button></div><div id="manual-panel" class="hidden"><label>Адрес сервера</label><input id="url" placeholder="https://example.trycloudflare.com"><label>Код подключения</label><input id="code" placeholder="Например: M993tA7B"><button id="manual-connect" class="primary">Подключиться</button></div><p id="message"></p></section></main><script src="html5-qrcode.min.js"></script><script>
let scanner=null;const message=document.querySelector('#message');
function note(text,bad=false){message.textContent=text;message.className=bad?'error':''}
function urlOf(value){try{const url=new URL(value.trim());return /https?:/.test(url.protocol)?url.href.replace(/\/$/,''):null}catch{return null}}
async function stop(){if(scanner){try{await scanner.stop()}catch{}scanner=null}document.querySelector('#camera').innerHTML=''}
function connect(address,code){const url=urlOf(address);if(!url)return note('Введите корректный адрес сервера.',true);localStorage.setItem('taskManagerServerUrl',url);localStorage.setItem('taskManagerPairingCode',code||'');stop();if(window.NativeTaskManager&&window.NativeTaskManager.openServer){window.NativeTaskManager.openServer(url)}else{note('Нативное подключение недоступно. Установите этот APK поверх старого.',true)}}
async function scan(){await stop();const status=document.querySelector('#camera-status');if(!window.Html5Qrcode){status.textContent='Сканер не загрузился. Установите новый APK.';return}try{status.textContent='Разрешите доступ к основной камере.';scanner=new Html5Qrcode('camera');const cameras=await Html5Qrcode.getCameras();const rear=cameras.find(c=>/back|rear|environment|main|зад/i.test(c.label))||cameras[cameras.length-1];if(!rear)throw Error('camera');await scanner.start(rear.id,{fps:10,qrbox:220},async text=>{await stop();try{const data=JSON.parse(text);connect(data.server_url,data.pairing_code)}catch{note('QR-код не содержит данных Task Manager.',true)}},()=>{});status.textContent='Наведите основную камеру на QR-код.'}catch{status.textContent='Не удалось открыть основную камеру. Разрешите камеру в настройках Android.';note('Камера недоступна.',true)}}
function panel(manual){document.querySelector('#qr-panel').classList.toggle('hidden',manual);document.querySelector('#manual-panel').classList.toggle('hidden',!manual);document.querySelector('#qr').classList.toggle('active',!manual);document.querySelector('#manual').classList.toggle('active',manual);if(manual)stop();else scan()}
document.querySelector('#qr').onclick=()=>panel(false);document.querySelector('#manual').onclick=()=>panel(true);document.querySelector('#manual-connect').onclick=()=>connect(document.querySelector('#url').value,document.querySelector('#code').value);document.querySelector('#payload-connect').onclick=()=>{try{const data=JSON.parse(document.querySelector('#payload').value);connect(data.server_url,data.pairing_code)}catch{note('Не удалось прочитать данные QR-кода.',true)}};document.querySelector('#url').value=localStorage.getItem('taskManagerServerUrl')||'';scan();
</script></body></html>
