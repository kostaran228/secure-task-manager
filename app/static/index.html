<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Task Manager</title>
    <style>
      :root { color-scheme: dark; --bg:#0b1020; --panel:#151d35; --muted:#9aa7c7; --line:#2b3860; --accent:#6ea8fe; --ok:#55d6a1; --danger:#ff7b8a; }
      * { box-sizing:border-box; } body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; background:radial-gradient(circle at 10% 0,#1e315d 0,transparent 35%),var(--bg); color:#eef3ff; min-height:100vh; }
      main { width:min(920px,calc(100% - 32px)); margin:48px auto; } header { display:flex; justify-content:space-between; gap:18px; align-items:start; margin-bottom:24px; }
      h1 { font-size:clamp(28px,5vw,42px); margin:0 0 8px; } p { color:var(--muted); margin:0; line-height:1.5; } .status { border:1px solid var(--line); border-radius:999px; padding:8px 12px; white-space:nowrap; color:var(--muted); }
      .status.ok { color:var(--ok); border-color:#28775e; } .grid { display:grid; grid-template-columns: 1fr 1.25fr; gap:18px; } .card { background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 18px 40px #0004; }
      h2 { margin:0 0 16px; font-size:18px; } label { display:block; margin:12px 0 6px; color:var(--muted); font-size:14px; } input,textarea { width:100%; border:1px solid var(--line); border-radius:9px; background:#0c1327; color:#eef3ff; padding:11px; font:inherit; } textarea { min-height:92px; resize:vertical; }
      button { border:0; border-radius:9px; background:var(--accent); color:#06122b; font-weight:700; padding:11px 14px; cursor:pointer; margin-top:14px; } button.secondary { background:transparent; color:#c9d6fa; border:1px solid var(--line); margin-left:8px; } button:hover { filter:brightness(1.08); }
      .hint { font-size:13px; margin-top:10px; } .message { min-height:24px; margin-top:12px; color:var(--muted); } .message.error { color:var(--danger); } .tasks { display:grid; gap:10px; } .task { border:1px solid var(--line); border-radius:10px; padding:13px; background:#0d152a; } .task h3 { margin:0 0 6px; font-size:16px; } .task small { color:var(--muted); } .empty { color:var(--muted); padding:22px 0; text-align:center; }
      .signed-in { border:1px solid #28775e; border-radius:10px; padding:14px; background:#102b29; } .signed-in strong { color:var(--ok); display:block; margin:5px 0 2px; overflow-wrap:anywhere; } .reminder-toggle { display:flex; align-items:center; gap:9px; margin:16px 0 4px; color:#c9d6fa; cursor:pointer; } .reminder-toggle input { width:auto; accent-color:var(--accent); } .reminder { color:var(--accent); display:block; margin-top:8px; }
      @media (max-width:720px) { main { margin:26px auto; } header { display:block; } .status { display:inline-block; margin-top:12px; } .grid { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Secure Task Manager</h1><p>Local task dashboard with protected API access.</p></div>
        <div><select id="language" aria-label="Language"><option value="en">EN</option><option value="ru">RU</option></select><div id="health" class="status">Checking service…</div></div>
      </header>
      <section class="grid">
        <div class="card">
          <div id="account-form"><h2>Account</h2>
            <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
            <label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="At least 8 characters">
            <p class="hint">Create an account once, then sign in. Your access token stays only in this browser tab.</p>
            <button id="register" type="button">Create account</button><button id="login" class="secondary" type="button">Sign in</button>
          </div>
          <div id="signed-in" class="signed-in" hidden><p>✓ You are signed in as</p><strong id="current-email"></strong><button id="forget-token" class="secondary" type="button">Sign out</button></div>
          <div id="message" class="message"></div>
          <div id="group-panel" hidden><h2>Team groups</h2><input id="new-group-name" maxlength="120" placeholder="New group name"><button id="create-group" type="button">Create group</button><div id="group-list" class="hint"></div><input id="member-email" type="email" placeholder="Member email"><select id="member-role"><option value="member">Member</option><option value="manager">Manager</option><option value="admin">Admin</option></select><button id="save-member" class="secondary" type="button">Add member</button></div>
          <h2 style="margin-top:28px">Create task</h2>
          <form id="task-form">
            <label for="title">Title</label><input id="title" maxlength="200" required placeholder="Example: prepare deployment demo">
            <label for="description">Description</label><textarea id="description" maxlength="1000" placeholder="Optional details"></textarea>
            <label for="task-group">Group</label><select id="task-group"><option value="">Personal task</option></select><input id="assignee-email" type="email" placeholder="Assignee email for group task" hidden>
            <label class="reminder-toggle"><input id="reminder-enabled" type="checkbox"> Set a reminder</label>
            <div id="reminder-options" hidden><label for="reminder-at">Remind me at</label><input id="reminder-at" type="datetime-local"></div>
            <button id="enable-notifications" class="secondary" type="button">Enable browser notifications</button>
            <button type="submit">Create task</button>
          </form>
        </div>
        <div class="card"><h2>Tasks</h2><div id="tasks" class="tasks"><div class="empty">Connect with your token to load tasks.</div></div></div>
      </section>
    </main>
    <script>
      const languageSelect=document.querySelector('#language'); const translations={ru:{'Secure Task Manager':'Менеджер задач','Local task dashboard with protected API access.':'Локальный менеджер задач','Account':'Аккаунт','Create account':'Создать аккаунт','Sign in':'Войти','Sign out':'Выйти','Create task':'Создать задачу','Title':'Название','Description':'Описание','Set a reminder':'Поставить напоминание','Remind me at':'Напомнить в','Enable browser notifications':'Включить уведомления','Tasks':'Задачи','Personal task':'Личная задача','Group':'Группа','Team groups':'Командные группы','Create group':'Создать группу','New group name':'Название новой группы','Add member':'Добавить участника','Member':'Участник','Manager':'Менеджер','Admin':'Администратор'}}; const reverse=Object.fromEntries(Object.entries(translations.ru).map(([en,ru])=>[ru,en])); function applyLanguage(lang){document.documentElement.lang=lang;const map=lang==='ru'?translations.ru:reverse;document.querySelectorAll('h1,h2,label,button,option,p,small').forEach(node=>{const text=node.textContent.trim();if(map[text])node.textContent=map[text];});localStorage.setItem('taskManagerLanguage',lang);} languageSelect.value=localStorage.getItem('taskManagerLanguage')||'en';languageSelect.onchange=()=>applyLanguage(languageSelect.value);applyLanguage(languageSelect.value);
      const emailInput = document.querySelector('#email'); const passwordInput = document.querySelector('#password'); const message = document.querySelector('#message'); const tasks = document.querySelector('#tasks'); const reminderEnabled = document.querySelector('#reminder-enabled'); const reminderOptions = document.querySelector('#reminder-options'); const reminderAt = document.querySelector('#reminder-at'); const notifiedReminders = new Set(JSON.parse(localStorage.getItem('notifiedReminders') || '[]'));
      let accessToken = sessionStorage.getItem('taskManagerAccessToken') || '';
      const headers = () => ({ 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' });
      const note = (text, error=false) => { message.textContent=text; message.className='message'+(error?' error':''); };
      async function loadTasks() { if (!accessToken) return; const response = await fetch('/tasks',{headers:headers()}); if (!response.ok) throw new Error(response.status===401?'Sign in to load your tasks.':'Unable to load tasks.'); const items=await response.json(); tasks.innerHTML=items.length?items.map(task=>`<article class="task"><h3>${escapeHtml(task.title)}</h3>${task.description?`<p>${escapeHtml(task.description)}</p>`:''}${task.reminder_at?`<small class="reminder">Reminder: ${new Date(task.reminder_at).toLocaleString()}</small>`:''}<small>${new Date(task.created_at+'Z').toLocaleString()}</small></article>`).join(''):'<div class="empty">No tasks yet. Create the first one.</div>'; scheduleReminders(items); }
      function escapeHtml(value) { const node=document.createElement('span'); node.textContent=value; return node.innerHTML; }
      function scheduleReminders(items) { for (const task of items) { if (!task.reminder_at || notifiedReminders.has(task.id)) continue; const notify = () => { if (notifiedReminders.has(task.id)) return; if ('Notification' in window && Notification.permission === 'granted') new Notification('Task reminder', { body: task.title, tag: `task-${task.id}` }); else note(`Reminder: ${task.title}`); notifiedReminders.add(task.id); localStorage.setItem('notifiedReminders', JSON.stringify([...notifiedReminders])); }; const waitUntilDue = () => { const delay = new Date(task.reminder_at).getTime() - Date.now(); if (delay <= 0) notify(); else setTimeout(waitUntilDue, Math.min(delay, 2147483647)); }; waitUntilDue(); } }
      function showSignedIn(email) { document.querySelector('#account-form').hidden=true; document.querySelector('#signed-in').hidden=false; document.querySelector('#current-email').textContent=email; }
      function showSignedOut() { document.querySelector('#account-form').hidden=false; document.querySelector('#signed-in').hidden=true; }
      async function refreshIdentity() { const response=await fetch('/auth/me',{headers:headers()}); if (!response.ok) throw new Error('Your session has expired. Sign in again.'); const profile=await response.json(); showSignedIn(profile.email); }
      async function authenticate(path) { const response = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailInput.value,password:passwordInput.value})}); const body=await response.json(); if (!response.ok) throw new Error(body.detail||'Unable to sign in.'); accessToken=body.access_token; sessionStorage.setItem('taskManagerAccessToken',accessToken); passwordInput.value=''; await refreshIdentity(); await loadTasks(); note(path.endsWith('register')?'Account created and signed in.':'Signed in.'); }
      document.querySelector('#register').onclick=async()=>{ try { await authenticate('/auth/register'); } catch(error) { note(error.message,true); } };
      document.querySelector('#login').onclick=async()=>{ try { await authenticate('/auth/login'); } catch(error) { note(error.message,true); } };
      document.querySelector('#forget-token').onclick=()=>{ sessionStorage.removeItem('taskManagerAccessToken'); accessToken=''; showSignedOut(); tasks.innerHTML='<div class="empty">Sign in to load tasks.</div>'; note('Signed out.'); emailInput.focus(); };
      reminderEnabled.onchange=()=>{ reminderOptions.hidden=!reminderEnabled.checked; reminderAt.required=reminderEnabled.checked; if (reminderEnabled.checked) reminderAt.focus(); };
      document.querySelector('#enable-notifications').onclick=async()=>{ if (!('Notification' in window)) return note('This browser does not support notifications.',true); const permission=await Notification.requestPermission(); note(permission==='granted'?'Browser notifications enabled.':'Notifications were not enabled.', permission!=='granted'); };
      document.querySelector('#task-form').onsubmit=async(event)=>{ event.preventDefault(); try { if (reminderEnabled.checked && !reminderAt.value) throw new Error('Choose a reminder date and time.'); const response=await fetch('/tasks',{method:'POST',headers:headers(),body:JSON.stringify({title:document.querySelector('#title').value,description:document.querySelector('#description').value||null,reminder_at:reminderEnabled.checked?reminderAt.value:null})}); if (!response.ok) throw new Error(response.status===401?'Sign in before creating tasks.':'Unable to create task.'); event.target.reset(); reminderOptions.hidden=true; await loadTasks(); note('Task created.'); } catch(error) { note(error.message,true); } };
      fetch('/health').then(response=>{ if(!response.ok) throw new Error(); document.querySelector('#health').textContent='● Service online'; document.querySelector('#health').classList.add('ok'); }).catch(()=>{ document.querySelector('#health').textContent='● Service unavailable'; });
      if (accessToken) refreshIdentity().then(loadTasks).catch(error=>{ sessionStorage.removeItem('taskManagerAccessToken'); accessToken=''; showSignedOut(); note(error.message,true); });
    </script>
    <script>
      const groupPanel=document.querySelector('#group-panel'), groupSelect=document.querySelector('#task-group'), assigneeInput=document.querySelector('#assignee-email');
      async function refreshGroups(){ if(!accessToken) return; const response=await fetch('/groups',{headers:headers()}); if(!response.ok) return; const groups=await response.json(); groupPanel.hidden=false; groupSelect.innerHTML='<option value="">Personal task</option>'+groups.map(g=>`<option value="${g.id}">${escapeHtml(g.name)} (${g.role})</option>`).join(''); document.querySelector('#group-list').innerHTML=groups.length?groups.map(g=>`${escapeHtml(g.name)} — ${g.role}`).join('<br>'):'No groups yet.'; }
      document.querySelector('#create-group').onclick=async()=>{ try{const response=await fetch('/groups',{method:'POST',headers:headers(),body:JSON.stringify({name:document.querySelector('#new-group-name').value})}); const body=await response.json(); if(!response.ok) throw new Error(body.detail); document.querySelector('#new-group-name').value=''; await refreshGroups(); note('Group created. You are Admin.');}catch(error){note(error.message,true);} };
      groupSelect.onchange=()=>{assigneeInput.hidden=!groupSelect.value;};
      document.querySelector('#save-member').onclick=async()=>{try{if(!groupSelect.value) throw new Error('Choose a group.'); const response=await fetch(`/groups/${groupSelect.value}/members`,{method:'POST',headers:headers(),body:JSON.stringify({email:document.querySelector('#member-email').value,role:document.querySelector('#member-role').value})}); const body=await response.json(); if(!response.ok) throw new Error(body.detail); note('Member updated.');}catch(error){note(error.message,true);}};
      const originalRefresh=refreshIdentity; refreshIdentity=async()=>{await originalRefresh(); await refreshGroups();};
      const originalSignOut=document.querySelector('#forget-token').onclick; document.querySelector('#forget-token').onclick=()=>{originalSignOut(); groupPanel.hidden=true;};
      document.querySelector('#task-form').onsubmit=async(event)=>{event.preventDefault(); try{if(reminderEnabled.checked&&!reminderAt.value) throw new Error('Choose a reminder date and time.'); const groupId=groupSelect.value; const response=await fetch('/tasks',{method:'POST',headers:headers(),body:JSON.stringify({title:document.querySelector('#title').value,description:document.querySelector('#description').value||null,reminder_at:reminderEnabled.checked?reminderAt.value:null,group_id:groupId?Number(groupId):null,assignee_email:groupId?assigneeInput.value:null})}); const body=await response.json(); if(!response.ok) throw new Error(body.detail||'Unable to create task.'); event.target.reset(); assigneeInput.hidden=true; reminderOptions.hidden=true; await loadTasks(); note('Task created.');}catch(error){note(error.message,true);}};
      if(accessToken) refreshGroups();
    </script>
  </body>
</html>
